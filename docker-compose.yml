version: '3.9'

services:
  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketanalyser
      POSTGRES_USER: ${POSTGRES_USER:-marketanalyser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketanalyser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - market_net

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ma_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - market_net

  # ─────────────────────────────────────────────
  # RabbitMQ
  # ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ma_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - market_net

  # ─────────────────────────────────────────────
  # Backend (Spring Boot)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ma_backend
    restart: unless-stopped
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/marketanalyser
      POSTGRES_USER: ${POSTGRES_USER:-marketanalyser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      MARKETSTACK_API_KEY: ${MARKETSTACK_API_KEY}
      MARKETSTACK_MONTHLY_LIMIT: ${MARKETSTACK_MONTHLY_LIMIT:-10000}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-demo}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-256-bit-secret-in-production}
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - market_net

  # ─────────────────────────────────────────────
  # Frontend (Next.js)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ma_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - market_net

  # ─────────────────────────────────────────────
  # Nginx (reverse proxy)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ma_nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - market_net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  market_net:
    driver: bridge
