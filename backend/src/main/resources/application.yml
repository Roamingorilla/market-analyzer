spring:
  application:
    name: market-analyser-backend

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/marketanalyser}
    username: ${POSTGRES_USER:marketanalyser}
    password: ${POSTGRES_PASSWORD:secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 10

  security:
    # JWT config - keys in env
    jwt:
      secret: ${JWT_SECRET:change-this-to-a-256-bit-secret-in-production}
      expiration-ms: 86400000  # 24h

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/plain
  error:
    include-stacktrace: never
    include-message: always

# Marketstack Configuration
marketstack:
  base-url: https://api.marketstack.com/v2
  api-key: ${MARKETSTACK_API_KEY:your-api-key-here}
  quota:
    monthly-limit: ${MARKETSTACK_MONTHLY_LIMIT:10000}
    safe-usage-percentage: ${MARKETSTACK_SAFE_USAGE_PCT:0.85}
    max-requests-per-minute: ${MARKETSTACK_MAX_PER_MINUTE:60}
  prefetch:
    enabled: true
    symbols: AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,JPM,V,NFLX

# Alpha Vantage Configuration (fundamentals)
alphavantage:
  base-url: https://www.alphavantage.co
  api-key: ${ALPHAVANTAGE_API_KEY:your-alpha-vantage-key}
  quota:
    daily-limit: ${ALPHAVANTAGE_DAILY_LIMIT:25}

# Cache TTL Configuration (seconds)
cache:
  ttl:
    eod-latest: 3600          # 1 hour
    eod-historical: 86400     # 24 hours
    eod-date: 2592000         # 30 days (historical = immutable)
    intraday: 900             # 15 minutes
    ticker: 604800            # 7 days
    exchange: 2592000         # 30 days
    splits: 604800            # 7 days
    dividends: 86400          # 24 hours
    currencies: 2592000       # 30 days
    timezones: 2592000        # 30 days
    fundamentals: 2592000     # 30 days (AV free tier - cache aggressively)
    ai-analysis: 21600        # 6 hours
    search: 3600              # 1 hour
    technical: 3600           # 1 hour (recalculated from cached prices)
    lock-ttl: 30              # 30s distributed lock TTL

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      marketstack:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
      alphavantage:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 120s
  retry:
    instances:
      marketstack:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
      alphavantage:
        max-attempts: 2
        wait-duration: 5s

# Logging
logging:
  level:
    com.marketanalyser: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# RabbitMQ Queues
rabbitmq:
  queues:
    market-data-refresh: market.data.refresh
    historical-ingest: market.historical.ingest
    cache-warming: market.cache.warming
    quota-monitor: market.quota.monitor

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  show-actuator: false
